<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ashoksdialect — channel dial</title>
<meta name="description" content="ashoksdialect — one voice, sixteen channels in orbit.">
<meta property="og:title" content="ashoksdialect">
<meta property="og:description" content="One voice, sixteen channels in orbit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ice:#8FE9FF;
  --text:#E8EEF6;
  --dim:#5A6A88;
  --hair:rgba(143,233,255,.13);
  --c:#8FE9FF;                     /* focused channel colour */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;height:100dvh}
body{
  background:#02030A;color:var(--text);
  font-family:'Space Grotesk',system-ui,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased;
  overscroll-behavior:none;touch-action:none;
}

/* ══ deep space ══ */
.sky{position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(130% 100% at 50% 8%, #101A3A 0%, #070B1D 42%, #02030A 78%),
    radial-gradient(80% 60% at 82% 92%, #1A1230 0%, transparent 60%);}
#stars{position:fixed;inset:0;z-index:1;pointer-events:none}
.nebula{
  position:fixed;left:50%;top:52%;width:120vmax;height:120vmax;z-index:1;
  transform:translate(-50%,-50%);pointer-events:none;filter:blur(60px);opacity:.7;
  background:
    radial-gradient(closest-side, color-mix(in srgb,var(--c) 17%,transparent), transparent 70%),
    radial-gradient(closest-side at 34% 62%, rgba(120,80,220,.16), transparent 66%),
    radial-gradient(closest-side at 70% 34%, rgba(30,140,190,.13), transparent 62%);
  transition:background 900ms cubic-bezier(.22,1,.36,1);
  animation:drift 48s ease-in-out infinite alternate;
}
@keyframes drift{to{transform:translate(-52%,-49%) scale(1.09) rotate(7deg)}}
.edge{position:fixed;inset:0;z-index:1;pointer-events:none;
  box-shadow:inset 0 0 200px 40px rgba(2,3,10,.82)}

/* ══ HUD ══ */
.hud{position:fixed;z-index:6;font-family:'JetBrains Mono',monospace;font-size:10.5px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--dim);pointer-events:none}
.hud .lit{color:var(--c);transition:color .5s}
.hud-tl{top:22px;left:clamp(16px,4vw,42px)}
.hud-tr{top:22px;right:clamp(16px,4vw,42px);text-align:right}
.hud-bl{bottom:22px;left:clamp(16px,4vw,42px)}
.hud-br{bottom:22px;right:clamp(16px,4vw,42px);text-align:right}
.mark{font-family:'Space Grotesk',sans-serif;font-size:clamp(15px,2.2vw,19px);font-weight:700;
  letter-spacing:-.03em;text-transform:none;color:var(--text);display:block;margin-bottom:3px}
.mark i{font-style:normal;color:var(--c);transition:color .5s}
.corner{position:fixed;width:24px;height:24px;border:1px solid var(--hair);z-index:5;pointer-events:none}
.c-tl{top:14px;left:14px;border-right:0;border-bottom:0}
.c-tr{top:14px;right:14px;border-left:0;border-bottom:0}
.c-bl{bottom:14px;left:14px;border-right:0;border-top:0}
.c-br{bottom:14px;right:14px;border-left:0;border-top:0}

/* ══ 3D scene ══ */
.stage{position:fixed;inset:0;z-index:3;perspective:1150px;perspective-origin:50% 47%;
  display:grid;place-items:center;cursor:grab}
.stage.dragging{cursor:grabbing}
.scene{position:relative;width:100%;height:100%;transform-style:preserve-3d;display:grid;place-items:center}
.layer{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
.layer > svg,.spin > svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:visible}
.spin{transform-style:preserve-3d;animation:spinZ var(--sp) linear infinite var(--sd,normal)}
@keyframes spinZ{to{transform:rotateZ(360deg)}}

.rim{fill:none;stroke:var(--hair);stroke-width:1}
.tick{stroke:var(--hair);stroke-width:1}
.glowring{fill:none;stroke:var(--c);stroke-width:1;opacity:.45;
  filter:drop-shadow(0 0 7px var(--c));transition:stroke .5s}
.dust circle{fill:var(--ice)}
.trail{fill:none;stroke:var(--c);stroke-width:1;opacity:.16;stroke-dasharray:3 9;transition:stroke .5s}

.comet{position:absolute;left:0;top:0;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;
  border-radius:50%;background:var(--c);box-shadow:0 0 16px 3px var(--c);opacity:.85;
  transition:background .5s,box-shadow .5s}

.node{position:absolute;left:0;top:0;display:grid;place-items:center;border-radius:50%;
  text-decoration:none;transform-style:preserve-3d;will-change:transform,opacity}
/* each channel is a lit sphere — the light comes from the star at the centre,
   so --lx/--ly are recomputed per planet, per frame, from its orbital position */
.node .disc{
  position:relative;display:grid;place-items:center;width:100%;height:100%;
  border-radius:50%;overflow:hidden;
  background:radial-gradient(circle at var(--lx,38%) var(--ly,32%),
    color-mix(in srgb,var(--nc) 30%,#28324B) 0%,
    color-mix(in srgb,var(--nc) 19%,#131A2C) 32%,
    color-mix(in srgb,var(--nc) 10%,#0A0F1C) 64%,
    #05070E 95%);
  box-shadow:inset var(--sx,0px) var(--sy,0px) 15px -5px rgba(2,4,12,.92),
             0 8px 20px -10px rgba(0,0,0,.95);
  filter:saturate(.5) brightness(.72);
  transition:filter .4s,box-shadow .45s;
}
/* surface bands scrolling under the lighting — the planet turning on its axis */
.node .disc::before{
  content:"";position:absolute;top:-12%;left:0;width:200%;height:124%;z-index:0;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.11) 0 2px,transparent 2px 9px),
             repeating-linear-gradient(90deg,rgba(0,0,0,.14) 0 5px,transparent 5px 17px);
  animation:surf var(--spin,9s) linear infinite;opacity:.3;
}
@keyframes surf{to{transform:translateX(-50%)}}
/* specular highlight, rim light on the dark limb, limb darkening */
.node .disc::after{
  content:"";position:absolute;inset:0;z-index:1;border-radius:50%;
  background:
    radial-gradient(circle at var(--lx,38%) var(--ly,32%),
      rgba(255,255,255,.3) 0%,rgba(255,255,255,.07) 12%,transparent 34%),
    radial-gradient(circle at calc(100% - var(--lx,38%)) calc(100% - var(--ly,32%)),
      rgba(255,255,255,.12) 0%,transparent 24%),
    radial-gradient(circle at 50% 50%,transparent 52%,rgba(2,4,12,.86) 94%);
}
.node svg{position:relative;z-index:2;width:47%;height:47%;display:block;
  fill:rgba(255,255,255,.9);filter:drop-shadow(0 1px 3px rgba(0,0,0,.85));transition:fill .3s}
.node.on .disc{
  filter:saturate(.95) brightness(.95);
  box-shadow:inset var(--sx,0px) var(--sy,0px) 15px -5px rgba(2,4,12,.85),
             0 0 28px color-mix(in srgb,var(--nc) 38%,transparent),
             0 0 0 1px color-mix(in srgb,var(--nc) 32%,transparent);
}
.node.on svg{fill:#fff}
.node:hover svg{fill:#fff}
.node{cursor:pointer}
.node:hover .disc{filter:saturate(1) brightness(1.05)}
.node:focus-visible{outline:2px solid var(--nc);outline-offset:6px}
.probe{visibility:hidden;pointer-events:none}

/* ══ core star ══ */
.core{position:absolute;left:50%;top:50%;z-index:4;transform:translate(-50%,-50%);
  width:clamp(220px,40vw,300px);text-align:center;pointer-events:none}
.star{position:relative;width:clamp(58px,9vw,74px);aspect-ratio:1;margin:0 auto 14px}
.corona{position:absolute;inset:-16px;border-radius:50%;border:1px solid color-mix(in srgb,var(--c) 30%,transparent);
  animation:breathe 5.5s ease-in-out infinite;transition:border-color .5s}
.corona:nth-of-type(2){inset:-30px;animation-delay:-2.6s;opacity:.55}
@keyframes breathe{50%{transform:scale(1.08);opacity:.35}}
.avatar{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;overflow:hidden;
  border:1px solid color-mix(in srgb,var(--c) 45%,transparent);
  background:radial-gradient(circle at 50% 35%,#1B2547,#070B18);
  box-shadow:0 0 34px -4px color-mix(in srgb,var(--c) 60%,transparent);
  font-weight:700;font-size:clamp(22px,3.4vw,28px);letter-spacing:-.04em;color:var(--c);
  transition:border-color .5s,box-shadow .5s,color .5s}
.avatar img{width:100%;height:100%;object-fit:cover}
.bio{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--dim);margin-bottom:16px}
.rule{width:32px;height:1px;background:var(--hair);margin:0 auto 16px}
.chan{font-size:clamp(27px,5.2vw,41px);font-weight:700;letter-spacing:-.035em;line-height:1;
  transition:opacity .18s ease}
.ipa{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--c);margin-top:8px;
  transition:opacity .18s,color .5s}
.gloss{font-size:13.5px;line-height:1.5;color:var(--dim);margin-top:11px;transition:opacity .18s}
.gloss em{font-style:italic;color:#7E8CA8}
.fade{opacity:0}

.strip{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);z-index:6;display:flex;gap:5px;pointer-events:none}
.pip{width:3px;height:9px;border-radius:2px;background:#1E2A44;transition:.35s}
.pip.on{height:15px;background:var(--c);box-shadow:0 0 10px var(--c)}

@media (max-width:700px){ .strip{bottom:70px} .gloss{display:none} .hud-br{display:none} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>

</div>

/* ══════════════════════════════════════════════════════════════════════
   3 · MECHANICS
   ══════════════════════════════════════════════════════════════════════ */
const STEP = 360 / ENTRIES.length;
let TILT = 58;

const $ = id => document.getElementById(id);
const stage=$('stage'), scene=$('scene'), dial=$('dial'), plate=$('plate'),
      beltTilt=$('beltTilt'), belt=$('belt'),
      cometTilt=$('cometTilt'), cometPath=$('cometPath'), cometDot=$('cometDot'),
      strip=$('strip'), idxEl=$('idx'), bandEl=$('band'),
      core={ chan:$('chan'), ipa:$('ipa'), gloss:$('gloss'),
             avatar:$('avatar'), bio:$('bio') };

core.bio.textContent = ME.bio;
core.avatar.innerHTML = ME.avatar ? '<img src="'+ME.avatar+'" alt="Ashok">' : ME.monogram;
$('tot').textContent = String(ENTRIES.length).padStart(2,'0');

/* ── nodes ── */
const nodes = ENTRIES.map((e,i) => {
  const a = document.createElement('a');
  a.className='node'; a.href=e.url; a.target='_blank'; a.rel='noopener noreferrer';
  a.style.setProperty('--nc', e.colour);
  a.setAttribute('aria-label', 'Open ' + e.name + ' in a new tab');
  a.style.setProperty('--spin', (7+Math.random()*7).toFixed(1)+'s');
  a.innerHTML = '<span class="disc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+e.icon+'"/></svg></span>';
  a.addEventListener('click', ev => { if (moved) ev.preventDefault(); });   // a drag isn't a click
  a.addEventListener('focus', () => goTo(i));
  a.addEventListener('pointerenter', () => hovering = true);
  a.addEventListener('pointerleave', () => hovering = false);
  dial.appendChild(a);
  return { el:a, angle:i*STEP, data:e, phase:Math.random()*6.28, rate:0.4+Math.random()*0.45 };
});
nodes.forEach(() => { const p=document.createElement('i'); p.className='pip'; strip.appendChild(p); });
const pips=[...strip.children];

/* hidden stand-in used to measure the dial's true on-screen footprint */
const probe = document.createElement('span');
probe.className='node probe'; probe.setAttribute('aria-hidden','true');
probe.innerHTML='<span class="disc"></span>';
dial.appendChild(probe);

/* ── state ── */
let R=300, SIZE=60, rot=0, target=0, focus=-1;
let tiltX=0, tiltY=0, tTiltX=0, tTiltY=0, pmx=0, pmy=0;
const norm = d => ((d+180)%360+360)%360-180;
const nodeSize = r => Math.max(40, Math.min(r*0.20, 70));
const tickPad  = r => Math.min(46, Math.max(16, r*0.14));

/* ── drawing ── */
function plateSVG(r){
  const pad=tickPad(r), s=(r+pad+26)*2, c=s/2;
  let t='';
  for (let i=0;i<72;i++){
    const a=i*5*Math.PI/180, long=i%6===0;
    const r1=r+pad*(long?.34:.6), r2=r+pad;
    t+='<line class="tick" x1="'+(c+Math.cos(a)*r1).toFixed(1)+'" y1="'+(c+Math.sin(a)*r1).toFixed(1)+
       '" x2="'+(c+Math.cos(a)*r2).toFixed(1)+'" y2="'+(c+Math.sin(a)*r2).toFixed(1)+
       '" opacity="'+(long?.85:.3)+'"/>';
  }
  return '<svg width="'+s+'" height="'+s+'">'+
    '<circle class="rim" cx="'+c+'" cy="'+c+'" r="'+(r*.40)+'" stroke-dasharray="2 8"/>'+
    '<circle class="rim" cx="'+c+'" cy="'+c+'" r="'+(r*.70)+'" stroke-dasharray="2 8"/>'+
    '<circle class="glowring" cx="'+c+'" cy="'+c+'" r="'+r+'"/>'+
    '<circle class="rim" cx="'+c+'" cy="'+c+'" r="'+(r+pad)+'"/>'+t+'</svg>';
}
/* the dust belt — a thin asteroid field outside the channel orbit */
let dustSeed=[];
function beltSVG(r){
  const inner=r*1.13, outer=r*1.34, s=(outer+14)*2, c=s/2;
  if (!dustSeed.length)
    dustSeed = Array.from({length:170},()=>({a:Math.random()*6.2832, t:Math.random(),
      z:Math.random()<.1?1.7:.9, o:(.10+Math.random()*.42)}));
  let d='';
  for (const p of dustSeed){
    const rr=inner+p.t*(outer-inner);
    d+='<circle cx="'+(c+Math.cos(p.a)*rr).toFixed(1)+'" cy="'+(c+Math.sin(p.a)*rr).toFixed(1)+
       '" r="'+p.z+'" opacity="'+p.o.toFixed(2)+'"/>';
  }
  return '<svg class="dust" width="'+s+'" height="'+s+'">'+d+'</svg>';
}
/* a lone body on a steeply inclined orbit, crossing the plane */
const COMET = 1.30;                     // comet orbit radius, as a multiple of R
function cometSVG(r){
  const rr=r*COMET, s=(rr+14)*2, c=s/2;
  return '<svg width="'+s+'" height="'+s+'"><circle class="trail" cx="'+c+'" cy="'+c+'" r="'+rr+'"/></svg>';
}

/* ── layout: guess, then verify against real rendered boxes ── */
function apply(){
  SIZE = nodeSize(R);
  plate.innerHTML  = plateSVG(R);
  belt.innerHTML   = beltSVG(R);
  const oldTrail = cometTilt.querySelector('svg');
  if (oldTrail) oldTrail.remove();
  cometTilt.insertAdjacentHTML('afterbegin', cometSVG(R));
  cometDot.style.transform = 'translateX('+(R*COMET)+'px)';
  const sz = SIZE+'px', m = (-SIZE/2)+'px';
  [...nodes.map(n=>n.el), probe].forEach(el => {
    el.style.width=sz; el.style.height=sz; el.style.marginLeft=m; el.style.marginTop=m;
  });
  dial.style.transform    = 'translate(-50%,-50%) rotateX('+TILT+'deg) rotateZ('+rot.toFixed(2)+'deg)';
  plate.style.transform   = 'translate(-50%,-50%) rotateX('+TILT+'deg)';
  beltTilt.style.transform= 'translate(-50%,-50%) rotateX('+(TILT+3)+'deg)';
  cometTilt.style.transform='translate(-50%,-50%) rotateZ(-22deg) rotateX('+(TILT-26)+'deg)';
}
function probeAt(phi, scale){
  probe.style.transform = 'rotateY('+(phi-rot)+'deg) translateZ('+R+'px) rotateY('+(-phi)+
                          'deg) rotateX('+(-TILT)+'deg) scale('+scale+')';
  return probe.getBoundingClientRect();
}
function measure(){
  const W=innerWidth, H=innerHeight, tight=W<700;
  TILT = H<620 ? 68 : H<780 ? 64 : 58;
  /* room kept clear for the HUD, the pip strip, the tilt wobble and the vertical bob */
  const m = { top: tight?60:80, bottom: tight?106:96, side: tight?12:30 };
  R = Math.min(W*0.45, H*0.72, 460);

  for (let i=0;i<16;i++){
    apply();
    const boxes = [
      plate.querySelector('svg').getBoundingClientRect(),
      probeAt(0, 1.10), probeAt(180, 0.58), probeAt(90, 0.84), probeAt(270, 0.84)
    ];
    const top    = Math.min(...boxes.map(b=>b.top))    - 10;   // bob + wobble slack
    const bottom = Math.max(...boxes.map(b=>b.bottom)) + 10;
    const left   = Math.min(...boxes.map(b=>b.left))   - 8;
    const right  = Math.max(...boxes.map(b=>b.right))  + 8;
    if (top>=m.top && bottom<=H-m.bottom && left>=m.side && right<=W-m.side) return;
    if (R<=90){ R=90; apply(); return; }
    R = Math.max(90, R*0.94);
  }
}

/* ── the loop ── */
function goTo(i){ target = -nodes[i].angle; idle = performance.now(); }
let idle = performance.now(), last = 0, hovering = false;
const AUTO = 360/95;                    // degrees per second — one orbit in 95s

function frame(now){
  const t = now/1000;
  rot   += (target-rot)*0.11;
  tiltX += (tTiltX-tiltX)*0.06;
  tiltY += (tTiltY-tiltY)*0.06;
  scene.style.transform = 'rotateX('+tiltX.toFixed(2)+'deg) rotateY('+tiltY.toFixed(2)+'deg)';

  const cosTilt=Math.cos(TILT*Math.PI/180);
  let best=0, bestD=1e9;
  for (let i=0;i<nodes.length;i++){
    const n=nodes[i], world=norm(n.angle+rot), d=Math.abs(world);
    if (d<bestD){ bestD=d; best=i; }
    const front=Math.cos(world*Math.PI/180), k=(front+1)/2;
    const s=0.58+0.52*k;
    const bob=Math.sin(t*n.rate + n.phase) * (SIZE*0.085);   // gentle hover
    n.el.style.transform =
      'rotateZ('+n.angle+'deg) translateY('+R+'px) rotateZ('+(-(n.angle+rot))+
      'deg) rotateX('+(-TILT)+'deg) translateY('+bob.toFixed(2)+'px) scale('+s.toFixed(3)+')';
    n.el.style.opacity = (0.24+0.76*Math.pow(k,1.4)).toFixed(3);
    n.el.style.zIndex  = Math.round(k*100);

    /* where the star's light falls on this planet, in its own screen-facing frame */
    const wr=world*Math.PI/180;
    const ox=-Math.sin(wr), oy=Math.cos(wr)*cosTilt;      // direction out from the star
    const len=Math.hypot(ox,oy)||1, ux=ox/len, uy=oy/len;
    const st=n.el.style;
    st.setProperty('--lx',(50-40*ux).toFixed(1)+'%');
    st.setProperty('--ly',(50-40*uy).toFixed(1)+'%');
    st.setProperty('--sx',(5.5*ux).toFixed(1)+'px');
    st.setProperty('--sy',(5.5*uy).toFixed(1)+'px');
  }
  dial.style.transform='translate(-50%,-50%) rotateX('+TILT+'deg) rotateZ('+rot.toFixed(2)+'deg)';
  if (best!==focus) setFocus(best);

  /* the system orbits clockwise on its own, and yields the moment you touch it */
  const dt = last ? Math.min(0.05,(now-last)/1000) : 0.016; last = now;
  if (!down && !hovering && now-idle > 3600) target += AUTO*dt;

  drawStars(t);
  requestAnimationFrame(frame);
}

function setFocus(i){
  const prev=focus; focus=i;
  if (prev>=0) nodes[prev].el.classList.remove('on');
  nodes[i].el.classList.add('on');
  const e=nodes[i].data;
  document.documentElement.style.setProperty('--c', e.colour);
  idxEl.textContent=String(i+1).padStart(2,'0');
  bandEl.textContent=e.band;
  pips.forEach((p,k)=>p.classList.toggle('on',k===i));
  [core.chan,core.ipa,core.gloss].forEach(el=>el.classList.add('fade'));
  clearTimeout(setFocus._t);
  setFocus._t=setTimeout(()=>{
    core.chan.textContent=e.name; core.ipa.textContent=e.phonetic;
    core.gloss.innerHTML=e.gloss;
    [core.chan,core.ipa,core.gloss].forEach(el=>el.classList.remove('fade'));
  },150);
}

/* ── starfield ── */
const cv=$('stars'), ctx=cv.getContext('2d');
let stars=[], DPR=1;
function seedStars(){
  DPR=Math.min(2, devicePixelRatio||1);
  cv.width=innerWidth*DPR; cv.height=innerHeight*DPR;
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
  const n=Math.min(420, Math.round(innerWidth*innerHeight/4200));
  stars=Array.from({length:n},()=>({
    x:Math.random(), y:Math.random(), z:Math.random(),
    r:Math.random()*1.05+0.22, tw:Math.random()*6.2832, sp:0.3+Math.random()*0.9
  }));
}
function drawStars(t){
  const W=cv.width, H=cv.height;
  ctx.clearRect(0,0,W,H);
  for (const s of stars){
    const depth=0.35+s.z;
    const x=((s.x + t*0.0016*s.z) % 1) * W + pmx*depth*26*DPR;
    const y=s.y*H + pmy*depth*20*DPR;
    const a=(0.30+0.42*Math.sin(t*s.sp + s.tw)) * (0.45+0.55*s.z);
    ctx.globalAlpha=Math.max(0,a);
    ctx.fillStyle = s.z>0.86 ? '#BFE9FF' : '#FFFFFF';
    const r=s.r*depth*DPR;
    ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fill();
  }
  ctx.globalAlpha=1;
}

/* ── input ── */
let lock=0;
stage.addEventListener('wheel', ev=>{
  ev.preventDefault();
  const now=performance.now(); if (now<lock) return;
  lock=now+110; idle=now;
  const d=Math.abs(ev.deltaY)>Math.abs(ev.deltaX)?ev.deltaY:ev.deltaX;
  target += (d>0 ? -STEP : STEP);
},{passive:false});

let down=false,lastX=0,moved=false;
stage.addEventListener('pointerdown',ev=>{
  down=true;moved=false;lastX=ev.clientX;idle=performance.now();
  stage.classList.add('dragging'); stage.setPointerCapture(ev.pointerId);
});
stage.addEventListener('pointermove',ev=>{
  if (down){
    const dx=ev.clientX-lastX; lastX=ev.clientX;
    if (Math.abs(dx)>1) moved=true;
    target += dx*0.32; idle=performance.now();
  }
  pmx = ev.clientX/innerWidth - .5;
  pmy = ev.clientY/innerHeight - .5;
  tTiltY = pmx*7;
  tTiltX = pmy*5;
});
function release(){
  if (!down) return;
  down=false; stage.classList.remove('dragging');
  target=Math.round(target/STEP)*STEP;
  idle=performance.now();
  setTimeout(()=>moved=false,60);
}
stage.addEventListener('pointerup',release);
stage.addEventListener('pointercancel',release);
addEventListener('keydown',ev=>{
  if (ev.key==='ArrowRight'||ev.key==='ArrowDown'){ target-=STEP; idle=performance.now(); ev.preventDefault(); }
  if (ev.key==='ArrowLeft' ||ev.key==='ArrowUp'  ){ target+=STEP; idle=performance.now(); ev.preventDefault(); }
  if (ev.key==='Enter' && document.activeElement===document.body && focus>=0) nodes[focus].el.click();
});

let rt;
const remeasure=()=>{ clearTimeout(rt); rt=setTimeout(()=>{ seedStars(); measure(); },90); };
addEventListener('resize',remeasure);
addEventListener('orientationchange',remeasure);
if (window.visualViewport) visualViewport.addEventListener('resize',remeasure);

seedStars();
measure();
goTo(0);
rot=-STEP*2.5;
requestAnimationFrame(frame);
</script>
</body>
</html>
